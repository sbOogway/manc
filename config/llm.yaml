# All model calls go through LiteLLM; the model is a provider-prefixed string.
# Set the matching API-key env var (OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, ...);
# Ollama needs none.
llm:
  model: openrouter/openrouter/free   # OpenRouter's router over its free models, picked per request
  # model: openrouter/anthropic/claude-opus-5
  # model: anthropic/claude-opus-5
  # model: openai/gpt-5
  # model: ollama/llama3.3
  fallback: openrouter/nex-agi/nex-n2.5-pro:free  # second model tried when the first errors
  temperature: 0
  batch_size: 40            # headlines per tagging call
