# All model calls go through LiteLLM; the model is a provider-prefixed string.
# Set the matching API-key env var (OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, ...);
# Ollama needs none.
llm:
  model: openrouter/nex-agi/nex-n2.5-pro:free   # passes the tagger benchmark (tests/analysis/test_live_tagger.py)
  # model: openrouter/anthropic/claude-opus-5
  # model: anthropic/claude-opus-5
  # model: openai/gpt-5
  # model: ollama_chat/gemma4:12b        # an Ollama server, OLLAMA_API_BASE=https://host
  fallback: openrouter/nex-agi/nex-n2.5-mini:free  # second model tried when the first errors
  temperature: 0
  batch_size: 40            # headlines per tagging call
