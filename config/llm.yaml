# All model calls go through LiteLLM; the model is a provider-prefixed string.
# claude_code/<model> runs Claude Code headless (`claude -p`) on the owner's login, no key.
# Other providers need their API-key env var (GROQ_API_KEY, MISTRAL_API_KEY, ANTHROPIC_API_KEY,
# OPENROUTER_API_KEY, ...); Ollama needs none.
llm:
  model: claude_code/opus                  # best on the tagger benchmark (tests/analysis/test_live_tagger.py)
  # model: groq/openai/gpt-oss-120b        # free; wants batch_size: 5
  # model: openrouter/nex-agi/nex-n2.5-pro:free
  # model: anthropic/claude-opus-5
  # model: ollama_chat/gemma4:12b          # an Ollama server, OLLAMA_API_BASE=https://host
  fallback: mistral/ministral-14b-latest   # second model tried when the first errors; free
  temperature: 0
  batch_size: 40            # headlines per tagging call
