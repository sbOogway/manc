# All model calls go through LiteLLM; the model is a provider-prefixed string.
# Set the matching API-key env var (GROQ_API_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY,
# ANTHROPIC_API_KEY, ...); Ollama needs none.
llm:
  model: groq/openai/gpt-oss-120b          # best on the tagger benchmark (tests/analysis/test_live_tagger.py)
  # model: openrouter/nex-agi/nex-n2.5-pro:free
  # model: anthropic/claude-opus-5
  # model: openai/gpt-5
  # model: ollama_chat/gemma4:12b          # an Ollama server, OLLAMA_API_BASE=https://host
  fallback: mistral/ministral-14b-latest   # second model tried when the first errors
  temperature: 0
  batch_size: 5             # headlines per tagging call; gpt-oss under-tags longer batches
