# Tracked assets. `economies` selects which countries' calendar events matter.
# `signs` says how a hotter-than-expected print from that economy moves the asset:
#   +1 tailwind, -1 headwind, 0 ignore. Categories: inflation, employment, growth, rates.
# Rules of thumb: hot data -> stronger currency, higher yields. A currency pair is base +1,
# quote -1 on every category. An equity index reacts to its own economy (hot inflation and
# rates hurt, jobs and growth help) and to the United States as global risk. Gold, silver
# and crypto dislike higher US yields; industrial metals and agricultural commodities lean
# on growth; energy on jobs and growth; a yield likes every hot print.
# `spot` names the ticker per spot source (display only). Yahoo quotes USD-quoted pairs as
# "JPY=X", futures as "GC=F", indices as "^GSPC", coins as "BTC-USD", US yields as "^TNX".
assets:
  # forex
  EURUSD:
    spot: {yahoo: "EURUSD=X"}
    kind: forex
    economies: [euro_area, united_states]
    signs:
      euro_area:     {inflation:  1, employment:  1, growth:  1, rates:  1}
      united_states: {inflation: -1, employment: -1, growth: -1, rates: -1}
  GBPUSD:
