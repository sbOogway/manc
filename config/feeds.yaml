# RSS sources. `weight` (0..1) scales each headline's contribution to the news term.
# Probed 2026-09-15; central banks and Reuters are primary sources and get full weight.
feeds:
  - name: reuters
    url: "https://news.google.com/rss/search?q=site:reuters.com+markets&hl=en-US&gl=US&ceid=US:en"
    weight: 1.0
  - name: fed
    url: https://www.federalreserve.gov/feeds/press_all.xml
    weight: 1.0
  - name: ecb
    url: https://www.ecb.europa.eu/rss/press.html
    weight: 1.0
  - name: boe
    url: https://www.bankofengland.co.uk/rss/news
    weight: 1.0
  - name: cnbc_economy
    url: https://www.cnbc.com/id/20910258/device/rss/rss.html
    weight: 0.8
  - name: cnbc_top
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    weight: 0.8
  - name: marketwatch_pulse
    url: https://feeds.content.dowjones.io/public/rss/mw_marketpulse
    weight: 0.8
  - name: bbc_business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    weight: 0.7
  - name: fxstreet
    url: https://www.fxstreet.com/rss/news
    weight: 0.6
  - name: investing_forex
    url: https://www.investing.com/rss/news_1.rss
    weight: 0.6
  - name: investing_commodities
    url: https://www.investing.com/rss/news_11.rss
    weight: 0.6
  - name: coindesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    weight: 0.6
  - name: oilprice
    url: https://oilprice.com/rss/main
    weight: 0.5

  # Newsletters and blogs with a feed, probed 2026-09-16. Commentary rather than reporting,
  # so they sit below the wires; a stale or dead feed is a warning in the log, not a failure.
  - name: marc_to_market            # Marc Chandler, daily FX and macro note
    url: https://www.marctomarket.com/feeds/posts/default
    weight: 0.6
  - name: calculated_risk           # US housing, labour and data flow, several posts a day
    url: https://calculatedrisk.substack.com/feed
    weight: 0.6
  - name: employ_america            # US labour market and inflation nowcasts
    url: https://www.employamerica.org/feed
    weight: 0.6
  - name: overshoot                 # Matthew Klein, weekly on inflation, growth and policy
    url: https://theovershoot.co/feed
    weight: 0.5
  - name: bond_vigilantes           # M&G, rates and credit
    url: https://bondvigilantes.com/feed
    weight: 0.5
  - name: econbrowser               # Chinn and Hamilton, academic macro on current data
    url: https://econbrowser.com/feed
    weight: 0.5
  - name: wolfstreet                # rates, housing and data, opinionated
    url: https://wolfstreet.com/feed/
    weight: 0.5
  - name: fxmacro                   # FXMacroGuy, weekly FX and macro consensus roundup
    url: https://www.fxmacro.info/feed
    weight: 0.5
  - name: policy_nexus              # Macro Musings, Fed policy commentary
    url: https://macroeconomicpolicynexus.substack.com/feed
    weight: 0.5
  - name: chartbook                 # Adam Tooze, daily link roundups; broad, so low weight
    url: https://adamtooze.substack.com/feed
    weight: 0.4
