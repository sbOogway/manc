[project]
name = "manc"
version = "0.2.1"
description = "Macro analysis, news and calendar: a daily 0-100 macro index per asset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mattia Papaccioli" }]
requires-python = ">=3.12,<3.13"
keywords = [
    "macro", "macroeconomics", "economic-calendar", "news", "rss", "sentiment",
    "forex", "gold", "oil", "equities", "bitcoin", "forecasts", "llm", "litellm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "litellm>=1.101.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
    "yfinance>=1.7.0",
]


[project.urls]
Repository = "https://github.com/sbOogway/manc"
Issues = "https://github.com/sbOogway/manc/issues"
Blueprint = "https://github.com/sbOogway/manc/blob/main/docs/blueprint.md"

[project.scripts]
manc = "manc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "respx>=0.22",
    "ruff>=0.16",
    "pre-commit>=4",
    "types-pyyaml>=6.0.12.20260906",
    "paracelsus>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manc"]

[tool.paracelsus]
base = "manc.store:schema"
column_sort = "preserve-order"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --cov=manc --cov-report=term-missing --cov-fail-under=85"
markers = ["live: hits real network sources; skipped by default"]
filterwarnings = [
    "ignore::DeprecationWarning:feedparser",  # updated_parsed fallback notice
    "ignore::DeprecationWarning:starlette.testclient",  # anyio alias, upstream
]

[tool.coverage.run]
source = ["src/manc"]
