[project]
name = "manc"
version = "0.1.0"
description = "Macro analysis, news and calendar: a daily 0-100 macro index per asset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
manc = "manc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "respx>=0.22",
    "ruff>=0.16",
    "pre-commit>=4",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --cov=manc --cov-report=term-missing --cov-fail-under=85"
markers = ["live: hits real network sources; skipped by default"]

[tool.coverage.run]
source = ["src/manc"]
