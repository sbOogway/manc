# Runs on every commit; a failing hook rejects the commit. The last hook runs after a merge
# or pull instead and publishes the dashboard build when the branch is main.
# Install once after cloning:
#   uv run pre-commit install --hook-type pre-commit --hook-type post-merge
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: er-schema
        name: er-schema up to date
        entry: uv run paracelsus inject docs/er-schema.md --check
        language: system
        pass_filenames: false
        files: ^(src/manc/store/schema\.py|docs/er-schema\.md)$
      - id: constraints
        name: constraints.txt exported from uv.lock
        entry: uv export --frozen --no-dev --no-hashes --no-emit-project --no-header -o src/manc/constraints.txt
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|src/manc/constraints\.txt)$
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: site-tests
        name: site check (vue-tsc + vitest)
        entry: npm --prefix site run check
        language: system
        pass_filenames: false
        files: ^site/
      - id: publish-site
        name: publish site to gh-pages (after a merge on main)
        entry: scripts/publish-site.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-merge]
