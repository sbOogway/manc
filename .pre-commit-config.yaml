# Runs on every commit; a failing hook rejects the commit.
# Install once after cloning: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: er-schema
        name: er-schema up to date
        entry: uv run paracelsus inject docs/er-schema.md --check
        language: system
        pass_filenames: false
        files: ^(src/manc/store/schema\.py|docs/er-schema\.md)$
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: site-tests
        name: site tests (node --test)
        entry: node --test 'site/tests/*.test.js'
        language: system
        pass_filenames: false
        files: ^site/
